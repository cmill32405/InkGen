[cosmic-ray]
module-path = [
  "src/InkGen/drawing_components.py",
  "src/InkGen/svg_generator.py",
  "src/InkGen/raster_renderer.py",
]
timeout = 30.0
excluded-modules = []
test-command = "env PYTHONPATH=src /home/ubuntu/.cache/inkgen_mutation_venv/bin/python -m pytest -x tests/test_raster_text_contract.py tests/test_text_contract.py -k 'multiline or aligned_tspan or zero_line_spacing or unpainted_text or live_invalid_line_spacing or live_nonstr_text'"

[cosmic-ray.distributor]
name = "local"

[cosmic-ray.filters.operators-filter]
exclude-operators = []
