[cosmic-ray]
module-path = ["src/InkGen/raster_renderer.py"]
timeout = 30.0
excluded-modules = []
test-command = "env PYTHONPATH=src /home/ubuntu/.cache/inkgen_mutation_venv/bin/python -m pytest -x tests/test_raster_path_contract.py tests/test_raster_path_curve_contract.py tests/test_raster_path_arc_contract.py"

[cosmic-ray.distributor]
name = "local"

[cosmic-ray.filters.operators-filter]
exclude-operators = []
