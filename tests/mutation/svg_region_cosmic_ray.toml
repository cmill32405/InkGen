[cosmic-ray]
module-path = [
  "src/InkGen/region_svg.py",
  "src/InkGen/text_outline.py",
]
timeout = 120.0
excluded-modules = []
test-command = "env PYTHONPATH=src /home/ubuntu/.cache/inkgen_mutation_venv/bin/python -m pytest -x tests/test_region_svg_contract.py tests/test_text_outline.py tests/test_text_outline_contract.py tests/test_public_api_contract.py"

[cosmic-ray.distributor]
name = "local"

[cosmic-ray.filters.operators-filter]
exclude-operators = []
